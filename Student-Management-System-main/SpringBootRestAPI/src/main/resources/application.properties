# app identity
spring.application.name=SpringBootRestAPI

# Let the platform provide DB connection via environment variables
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Use Postgres dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# recommended for dev: update schema automatically (use with caution in prod)
spring.jpa.hibernate.ddl-auto=update

# Logging
spring.jpa.show-sql=true

# Server port (Render provides PORT env; fallback to 8080)
server.port=${PORT:8080}
