name: CI/CD - Spring Boot Student Management System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PROJECT_DIR: student-management-api-springboot-mysql/Student-Management-System-main/SpringBootRestAPI
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/student-management-api
  CONTAINER_PORT: 8080

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build Maven Project
        run: |
          cd $PROJECT_DIR
          mvn -B -DskipTests=false package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.PROJECT_DIR }}/target/*.jar

      - name: Short SHA
        id: sha
        run: echo "::set-output name=short-sha::${GITHUB_SHA::8}"

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./artifact

      - name: Place jar inside project target folder
        run: |
          mkdir -p $PROJECT_DIR/target
          cp ./artifact/*.jar $PROJECT_DIR/target/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short-sha }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

  deploy:
    name: Deploy to Server (optional)
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' && secrets.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop student_api || true
            docker rm student_api || true
            docker run -d --restart unless-stopped \
              --name student_api -p 80:${{ env.CONTAINER_PORT }} \
              ${{ env.IMAGE_NAME }}:latest
          EOF
